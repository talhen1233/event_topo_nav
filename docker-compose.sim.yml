services:
  gazebo:
    image: event_topo_nav/drone_gazebo:local
    build:
      context: ./drone_gazebo
      dockerfile: Dockerfile
      target: release
    container_name: drone_gazebo
    network_mode: host
    ipc: host
    privileged: true
    gpus: all
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.gz:/root/.gz
    command: >
      ros2 launch drone_simulation crazyflie_final_prelim_03.launch.py
